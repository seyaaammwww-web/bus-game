<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>أوتوبيس كومبليت - لعبة الحروف العائلية</title>
  <meta name="description" content="لعبة أوتوبيس كومبليت المصرية - العب مع عيلتك وأصحابك واستمتع بتحدي الحروف!" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Pixelify Sans - Fallback Pixel Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* ================================================
         🎮 FONT FACES - تحميل الخطوط المحلية
         ================================================ */

    /* الخط العربي - QTS-Hoby */
    @font-face {
      font-family: 'QTS-Hoby';
      src: url('/fonts/QTS-Hoby/QTS-Hoby.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* الخط الإنجليزي - Dogica Pixel */
    @font-face {
      font-family: 'Dogica Pixel';
      src: url('/fonts/DogicaPixel/TTF/dogicapixel.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Dogica Pixel';
      src: url('/fonts/DogicaPixel/TTF/dogicapixelbold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ================================================
         🌍 GLOBAL FONT - تطبيق على كل العناصر
         ================================================ */

    * {
      font-family: 'QTS-Hoby', 'Dogica Pixel', 'Pixelify Sans', sans-serif !important;
      font-weight: 700;
    }

    body {
      font-family: 'QTS-Hoby', 'Dogica Pixel', 'Pixelify Sans', sans-serif !important;
      font-weight: 700;
      direction: rtl;
    }

    /* الأرقام والنص الإنجليزي */
    .english-text,
    [lang="en"] {
      font-family: 'Dogica Pixel', 'Pixelify Sans', monospace !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
